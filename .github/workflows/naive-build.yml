name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag'
        type: string
        required: false
      profile:
        description: 'main = the five targets JiejieBox ships (linux/amd64, windows/amd64, android/arm64, darwin/arm64, ios/arm64); full = every target'
        type: choice
        options: [main, full]
        default: main
      publish:
        description: 'Publish the built libraries to the consuming branch (manual runs publish only when this is on)'
        type: boolean
        default: false
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# The publish job force-pushes the built libraries to the consuming branch. Without this block the
# token is read-only for contents and the push fails with 403 - which is what happened on the first
# four-target run: every build succeeded and the publish step could not write.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    # What this run builds.
    #
    # Push builds the five targets the product actually links: linux/amd64 (glibc), windows/amd64,
    # android/arm64, darwin/arm64 and ios/arm64. The other architectures are free to break against an
    # external mirror (they did, five times in one night, against snapshot.debian.org) and each
    # failure cancels its siblings - so the five that matter waited behind the ones nobody consumes.
    # They are still buildable: dispatch with profile=full.
    runs-on: ubuntu-22.04
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      android: ${{ steps.plan.outputs.android }}
      darwin: ${{ steps.plan.outputs.darwin }}
    steps:
      - id: plan
        run: |
          set -euo pipefail
          profile="${{ inputs.profile }}"
          if [ -z "$profile" ]; then profile=main; fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          if [ "$profile" = full ]; then
            echo 'linux={"arch":["amd64","arm64","386","arm","loong64","mipsle","mips64le","riscv64"]}' >> "$GITHUB_OUTPUT"
            echo 'windows={"arch":["amd64","arm64"]}' >> "$GITHUB_OUTPUT"
            echo 'android={"include":[{"arch":"arm64","cc":"aarch64-linux-android23-clang"},{"arch":"amd64","cc":"x86_64-linux-android23-clang"},{"arch":"arm","cc":"armv7a-linux-androideabi23-clang"},{"arch":"386","cc":"i686-linux-android23-clang"}]}' >> "$GITHUB_OUTPUT"
            echo 'darwin={"include":[{"target":"darwin/amd64","name":"darwin-amd64"},{"target":"darwin/arm64","name":"darwin-arm64"},{"target":"ios/arm64","name":"ios-arm64"},{"target":"ios/arm64/simulator","name":"ios-arm64-simulator"},{"target":"ios/amd64","name":"ios-amd64-simulator"},{"target":"tvos/arm64","name":"tvos-arm64"},{"target":"tvos/arm64/simulator","name":"tvos-arm64-simulator"},{"target":"tvos/amd64","name":"tvos-amd64-simulator"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'linux={"arch":["amd64"]}' >> "$GITHUB_OUTPUT"
            echo 'windows={"arch":["amd64"]}' >> "$GITHUB_OUTPUT"
            echo 'android={"include":[{"arch":"arm64","cc":"aarch64-linux-android23-clang"}]}' >> "$GITHUB_OUTPUT"
            echo 'darwin={"include":[{"target":"darwin/arm64","name":"darwin-arm64"},{"target":"ios/arm64","name":"ios-arm64"}]}' >> "$GITHUB_OUTPUT"
          fi
  linux:
    # The glibc family. The daily profile builds only amd64 - the Linux target the product ships;
    # musl and the other architectures stay behind profile=full.
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Regenerate Debian keyring
        run: |
          rm -f ./naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            naiveproxy/src/third_party/llvm-build
            naiveproxy/src/gn/out
            naiveproxy/src/chrome/build/pgo_profiles
            naiveproxy/src/out/sysroot-build
          key: toolchain-linux-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-${{ hashFiles('naiveproxy/src/get-clang.sh', 'naiveproxy/src/get-sysroot.sh', 'naiveproxy/src/get-openwrt.sh', 'naiveproxy/src/DEPS', 'naiveproxy/src/tools/clang/scripts/update.py', 'naiveproxy/src/build/linux/sysroot_scripts/sysroot_creator.py', 'naiveproxy/src/build/linux/sysroot_scripts/reversion_glibc.py', 'naiveproxy/src/build/linux/sysroot_scripts/generated_package_lists/**', 'cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-linux-${{ matrix.arch }}
      - name: Cache ccache files
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}
          restore-keys: ccache-linux-${{ matrix.arch }}-
      - name: Install packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update || true
          sudo apt install -y ninja-build ccache
      - name: Reset ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -z
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=linux/${{ matrix.arch }} build
      - name: Show ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -s
      - name: Package
        run: |
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} package --local
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} package
      - name: Download clang and sysroot
        run: go run ./cmd/build-naive --target=linux/${{ matrix.arch }} download-toolchain
      - name: Install QEMU for cross-platform testing
        run: |
          sudo apt update || true
          sudo apt install -y qemu-user-binfmt
      - name: Build test binary
        run: |
          eval $(go run ./cmd/build-naive --target=linux/${{ matrix.arch }} env --export)
          GO_TEST_LDFLAGS=
          if [ "${{ matrix.arch }}" = "mipsle" ] || [ "${{ matrix.arch }}" = "mips64le" ]; then
            GO_TEST_LDFLAGS=-ldflags=-w
          fi
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} go -C test test -c $GO_TEST_LDFLAGS -o ../cronet.test .
      - name: Run test binary
        run: |
          eval $(go run ./cmd/build-naive --target=linux/${{ matrix.arch }} env --export)
          if [ "${{ matrix.arch }}" != "amd64" ] && [ "${{ matrix.arch }}" != "386" ]; then
            export QEMU_LD_PREFIX
          fi
          ./cronet.test -test.v -test.run=TestEngineVersion
      - name: Build purego test binary
        if: matrix.arch == 'amd64' || matrix.arch == 'arm64' || matrix.arch == 'loong64'
        run: |
          cp lib/linux_${{ matrix.arch }}/libcronet.so .
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go -C test test -tags with_purego -c -o ../cronet.purego.test .
      - name: Run purego test binary
        if: matrix.arch == 'amd64' || matrix.arch == 'arm64' || matrix.arch == 'loong64'
        run: |
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            eval $(go run ./cmd/build-naive --target=linux/${{ matrix.arch }} env --export)
            export QEMU_LD_PREFIX
          fi
          export LD_LIBRARY_PATH=$PWD
          ./cronet.purego.test -test.v -test.run=TestEngineVersion
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-${{ matrix.arch }}
          path: |
            lib/
            include/
            include_cgo.go
            lib_*_cgo.go

  darwin:
    needs: plan
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.darwin) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.22
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-${{ matrix.name }}
      - name: Cache ccache files
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-darwin-${{ matrix.name }}-${{ steps.chromium.outputs.version }}
          restore-keys: ccache-darwin-${{ matrix.name }}-
      - name: Install tools
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: brew install ninja ccache
      - name: Reset ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -z
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=${{ matrix.target }} build
      - name: Show ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -s
      - name: Package
        run: |
          go run ./cmd/build-naive --target=${{ matrix.target }} package --local
          go run ./cmd/build-naive --target=${{ matrix.target }} package
      - name: Build and run test binary
        if: matrix.target == 'darwin/arm64'
        run: |
          CGO_ENABLED=1 go -C test test -c -o ../cronet.test .
          ./cronet.test -test.v -test.run=TestEngineVersion
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-${{ matrix.name }}
          path: |
            lib/
            include/
            include_cgo.go
            lib_*_cgo.go

  windows:
    needs: plan
    runs-on: windows-2022
    env:
      SCCACHE_ARM64_VERSION: 0.12.0
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.22
      - name: Get naiveproxy commit
        id: naive
        shell: bash
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        shell: bash
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-windows-${{ matrix.arch }}
      - name: Install tools
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          choco install ninja -y
      - name: Install sccache
        if: steps.build-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "arm64") {
            choco install sccache --version=${{ env.SCCACHE_ARM64_VERSION }} -y
          } else {
            choco install sccache -y
          }
      - name: Get sccache version
        if: steps.build-cache.outputs.cache-hit != 'true'
        id: sccache
        shell: pwsh
        run: |
          $rawVersion = sccache --version
          if ($LASTEXITCODE -ne 0) {
            throw "failed to get sccache version"
          }
          $version = ($rawVersion | Select-Object -First 1) -replace '^sccache\s+', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "invalid sccache version output: $rawVersion"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Cache sccache files
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Mozilla/sccache
          key: sccache-windows-${{ matrix.arch }}-${{ steps.sccache.outputs.version }}-${{ steps.chromium.outputs.version }}
          restore-keys: sccache-windows-${{ matrix.arch }}-${{ steps.sccache.outputs.version }}-
      - name: Reset sccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: sccache -z
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=windows/${{ matrix.arch }} build
      - name: Show sccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: sccache -s
      - name: Package
        run: go run ./cmd/build-naive --target=windows/${{ matrix.arch }} package
      - name: Build and run test binary
        if: matrix.arch != 'arm64'
        shell: bash
        run: |
          # Copy DLL to current directory for fallback loading
          cp lib/windows_${{ matrix.arch }}/libcronet.dll .
          CGO_ENABLED=0 \
          GOOS=windows \
          GOARCH=${{ matrix.arch }} \
          go -C test test -tags with_purego -c -o ../cronet.test.exe .
          ./cronet.test.exe -test.v -test.run=TestEngineVersion
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-windows-${{ matrix.arch }}
          path: |
            lib/
            include/
            include_cgo.go

  android:
    needs: plan
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.android) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.22
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-android-${{ matrix.arch }}
      - name: Cache ccache files
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}
          restore-keys: ccache-android-${{ matrix.arch }}-
      - name: Install packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update || true
          sudo apt install -y ninja-build ccache
      - name: Reset ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -z
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=android/${{ matrix.arch }} build
      - name: Show ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -s
      - name: Package
        run: |
          go run ./cmd/build-naive --target=android/${{ matrix.arch }} package --local
          go run ./cmd/build-naive --target=android/${{ matrix.arch }} package
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
      - name: Build test binary
        run: |
          CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }} \
          CGO_ENABLED=1 GOOS=android GOARCH=${{ matrix.arch }} go -C test test -c -o ../cronet.test .
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-android-${{ matrix.arch }}
          path: |
            lib/
            include/
            include_cgo.go
            lib_*_cgo.go

  linux-musl:
    needs: plan
    if: needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, "386", arm, loong64, mipsle, riscv64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.22
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            naiveproxy/src/third_party/llvm-build
            naiveproxy/src/gn/out
            naiveproxy/src/chrome/build/pgo_profiles
            naiveproxy/src/out/sysroot-build
          key: toolchain-linux-musl-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}-${{ hashFiles('naiveproxy/src/get-clang.sh', 'naiveproxy/src/get-sysroot.sh', 'naiveproxy/src/get-openwrt.sh', 'naiveproxy/src/DEPS', 'naiveproxy/src/tools/clang/scripts/update.py', 'naiveproxy/src/build/linux/sysroot_scripts/sysroot_creator.py', 'naiveproxy/src/build/linux/sysroot_scripts/reversion_glibc.py', 'naiveproxy/src/build/linux/sysroot_scripts/generated_package_lists/**', 'cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-linux-musl-${{ matrix.arch }}
      - name: Cache ccache files
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-musl-${{ matrix.arch }}-${{ steps.chromium.outputs.version }}
          restore-keys: ccache-linux-musl-${{ matrix.arch }}-
      - name: Install packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update || true
          sudo apt install -y ninja-build zstd ccache
      - name: Reset ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -z
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl build
      - name: Show ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -s
      - name: Package
        run: |
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl package --local
          go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl package
      - name: Download toolchain
        run: go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl download-toolchain
      - name: Install QEMU for cross-platform testing
        run: |
          sudo apt update || true
          sudo apt install -y qemu-user-binfmt
      - name: Build test binary
        run: |
          eval $(go run ./cmd/build-naive --target=linux/${{ matrix.arch }} --libc=musl env --export)
          [[ "${{ matrix.arch }}" == "mipsle" ]] && export GOMIPS=softfloat || true
          GO_TEST_LDFLAGS=
          [[ "${{ matrix.arch }}" == "mipsle" ]] && GO_TEST_LDFLAGS=-ldflags=-w || true
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} go -C test test -c $GO_TEST_LDFLAGS -tags with_musl -o ../cronet.test .
      - name: Run test binary
        run: |
          # Static binary - can run directly with QEMU binfmt or explicit QEMU for cross-arch
          case "${{ matrix.arch }}" in
            amd64)   QEMU=() ;;
            arm64)   QEMU=(qemu-aarch64) ;;
            386)     QEMU=(qemu-i386) ;;
            arm)     QEMU=(qemu-arm) ;;
            loong64) QEMU=(qemu-loongarch64) ;;
            mipsle)  QEMU=(qemu-mipsel) ;;
            riscv64) QEMU=(qemu-riscv64) ;;
          esac
          timeout 120 "${QEMU[@]}" ./cronet.test -test.v -test.run=TestEngineVersion -test.timeout=90s
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-musl-${{ matrix.arch }}
          path: |
            lib/
            include/
            include_cgo.go
            lib_*_cgo.go

  integration-test:
    # Full-profile only: its matrix consumes the Linux and Intel artifacts, which the daily profile
    # does not build.
    if: needs.plan.outputs.profile == 'full'
    needs: [plan, linux, darwin, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: linux-amd64-cgo
            os: ubuntu-22.04
            artifact: cronet-linux-amd64
            target: linux/amd64
            mode: cgo
          - name: linux-amd64-purego
            os: ubuntu-22.04
            artifact: cronet-linux-amd64
            target: linux/amd64
            mode: purego
          - name: linux-arm64-purego
            os: ubuntu-22.04-arm
            artifact: cronet-linux-arm64
            target: linux/arm64
            mode: purego
          # macOS ARM64
          - name: darwin-arm64-macos15
            os: macos-15
            artifact: cronet-darwin-arm64
            target: darwin/arm64
            mode: cgo
          - name: darwin-arm64-macos26
            os: macos-26
            artifact: cronet-darwin-arm64
            target: darwin/arm64
            mode: cgo
          # macOS x64 (Intel)
          - name: darwin-amd64-macos15
            os: macos-15-intel
            artifact: cronet-darwin-amd64
            target: darwin/amd64
            mode: cgo
          # Windows x64
          - name: windows-amd64-2022
            os: windows-2022
            artifact: cronet-windows-amd64
            target: windows/amd64
            mode: purego
          - name: windows-amd64-2025
            os: windows-2025
            artifact: cronet-windows-amd64
            target: windows/amd64
            mode: purego
          # Windows ARM64
          - name: windows-arm64
            os: windows-11-arm
            artifact: cronet-windows-arm64
            target: windows/arm64
            mode: purego
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CRONET_TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/${{ matrix.name }}
      CRONET_TEST_CAPTURE_NETLOG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .

      - name: Get Chromium version
        id: chromium
        shell: bash
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT

      # Linux: restore toolchain cache (needed for env command)
      - name: Restore toolchain cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: |
            naiveproxy/src/third_party/llvm-build
            naiveproxy/src/gn/out
            naiveproxy/src/chrome/build/pgo_profiles
            naiveproxy/src/out/sysroot-build
          key: toolchain-linux-${{ contains(matrix.target, 'arm64') && 'arm64' || 'amd64' }}-${{ steps.chromium.outputs.version }}-${{ hashFiles('naiveproxy/src/get-clang.sh', 'naiveproxy/src/get-sysroot.sh', 'naiveproxy/src/get-openwrt.sh', 'naiveproxy/src/DEPS', 'naiveproxy/src/tools/clang/scripts/update.py', 'naiveproxy/src/build/linux/sysroot_scripts/sysroot_creator.py', 'naiveproxy/src/build/linux/sysroot_scripts/reversion_glibc.py', 'naiveproxy/src/build/linux/sysroot_scripts/generated_package_lists/**', 'cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}

      - name: Download toolchain (Linux)
        if: runner.os == 'Linux'
        run: go run ./cmd/build-naive --target=${{ matrix.target }} download-toolchain

      # Install iperf3
      - name: Install iperf3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update || true
          sudo apt install -y iperf3

      - name: Install iperf3 (macOS)
        if: runner.os == 'macOS'
        run: brew install iperf3

      - name: Install iperf3 (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest https://files.budman.xyz/iperf3.20_64.zip -OutFile iperf3.zip
          if ((Get-FileHash iperf3.zip -Algorithm SHA256).Hash -ne "7F8FABEB885EEB61345F0658D6D0E476248E313CBD182B336AE5AC81FBA5DAED") { throw "iperf3.zip checksum mismatch" }
          Expand-Archive iperf3.zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\iperf3.20" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # CGO mode tests
      - name: Run integration tests (CGO)
        if: matrix.mode == 'cgo'
        timeout-minutes: 20
        run: |
          mkdir -p "$CRONET_TEST_ARTIFACT_DIR"
          eval $(go run ./cmd/build-naive --target=${{ matrix.target }} env --export)
          cd test
          LOG_PATH="$CRONET_TEST_ARTIFACT_DIR/go-test.log"
          if ! CGO_ENABLED=1 go test -v -timeout=12m >"$LOG_PATH" 2>&1; then
            tail -n 400 "$LOG_PATH" || true
            exit 1
          fi

      # purego mode tests
      - name: Run integration tests (purego - Linux)
        if: matrix.mode == 'purego' && runner.os == 'Linux'
        timeout-minutes: 20
        working-directory: test
        run: |
          mkdir -p "$CRONET_TEST_ARTIFACT_DIR"
          export LD_LIBRARY_PATH=$PWD/../lib/linux_${{ contains(matrix.target, 'arm64') && 'arm64' || 'amd64' }}
          LOG_PATH="$CRONET_TEST_ARTIFACT_DIR/go-test.log"
          if ! CGO_ENABLED=0 go test -tags with_purego -v -timeout=12m >"$LOG_PATH" 2>&1; then
            tail -n 400 "$LOG_PATH" || true
            exit 1
          fi

      - name: Run integration tests (purego - Windows)
        if: matrix.mode == 'purego' && runner.os == 'Windows'
        timeout-minutes: 20
        working-directory: test
        shell: bash
        run: |
          # Determine library directory based on target architecture
          case "${{ matrix.target }}" in
            */arm64) LIB_DIR="windows_arm64" ;;
            */amd64) LIB_DIR="windows_amd64" ;;
          esac
          export PATH="$PWD/../lib/${LIB_DIR}:$PATH"
          mkdir -p "$CRONET_TEST_ARTIFACT_DIR"
          LOG_PATH="$CRONET_TEST_ARTIFACT_DIR/go-test.log"
          if ! go test -tags with_purego -v -timeout=12m >"$LOG_PATH" 2>&1; then
            tail -n 400 "$LOG_PATH" || true
            exit 1
          fi

      - name: Stress QUIC socket handoff (Windows Server 2022)
        if: matrix.name == 'windows-amd64-2022'
        timeout-minutes: 10
        working-directory: test
        shell: bash
        run: |
          export PATH="$PWD/../lib/windows_amd64:$PATH"
          go test -tags with_purego -run '^TestNaiveQUICLargeTransfer$' -count=20 -timeout=8m

      - name: Upload integration logs (test failure)
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.name }}
          path: test-artifacts/${{ matrix.name }}/
          if-no-files-found: warn

  publish:
    # A push publishes the daily profile. A manual run publishes only when asked: a dispatch that
    # silently moved the consuming branch would be a build that changes other repositories as a
    # side effect.
    if: |
      always() && !cancelled() && !contains(needs.*.result, 'failure')
      && (github.event_name == 'push' || inputs.publish)
      && !contains(github.event.head_commit.message, '[skip publish]')
    needs: [plan, linux, linux-musl, darwin, windows, android, integration-test]
    runs-on: ubuntu-22.04
    outputs:
      branch: ${{ steps.published.outputs.branch }}
      commit: ${{ steps.published.outputs.commit }}
    env:
      TARGET_BRANCH: ${{ github.ref_name == 'main' && 'go' || 'go_dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ^1.22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Every target this profile promises must be a real artifact
        # A run where one platform was cancelled and the others succeeded used to publish whatever it
        # had: the merged tree still contains every lib directory (the unbuilt ones keep the previous
        # commit's binaries), so the consuming branch would advertise a new version whose Apple
        # binaries are the old ones. Publishing is the one step that must not tolerate a partial
        # matrix - and an artifact directory is not evidence on its own: each promised target has to
        # carry a native library of the architecture it names, and all of them have to come from one
        # Chromium baseline.
        run: |
          set -euo pipefail
          echo "source commit: ${GITHUB_SHA}"
          echo "naiveproxy:    $(git ls-tree HEAD naiveproxy | awk '{print $3}')"
          python3 - "${{ inputs.profile || 'main' }}" <<'PY'
          import hashlib
          import os
          import struct
          import sys

          profile = sys.argv[1]

          # artifact, native library directory, file kind, machine, files that must be present
          if profile == "main":
              promises = [
                  ("cronet-linux-amd64", "lib/linux_amd64", "elf", 62, ["libcronet.a", "libcronet.so"]),
                  ("cronet-windows-amd64", "lib/windows_amd64", "pe", 0x8664, ["libcronet.dll"]),
                  ("cronet-darwin-arm64", "lib/darwin_arm64", "macho", 0x0100000C, ["libcronet.a"]),
                  ("cronet-ios-arm64", "lib/ios_arm64", "macho", 0x0100000C, ["libcronet.a"]),
                  ("cronet-android-arm64", "lib/android_arm64", "elf", 183, ["libcronet.a"]),
              ]
          else:
              print("full profile: the matrix is the promise, not a fixed platform list")
              raise SystemExit(0)

          failures = []
          versions = {}


          def ar_members(data):
              # ar(1): "!<arch>\n" then 60-byte headers, member data padded to an even offset.
              if not data.startswith(b"!<arch>\n"):
                  return
              offset = 8
              while offset + 60 <= len(data):
                  header = data[offset:offset + 60]
                  try:
                      size = int(header[48:58].decode().strip() or "0")
                  except ValueError:
                      return
                  start = offset + 60
                  body = data[start:start + size]
                  # BSD ar (Apple's libtool) keeps long names in the first bytes of the member and
                  # counts them in the member size; GNU ar does not.
                  if header[0:3] == b"#1/":
                      try:
                          name_length = int(header[3:16].decode().strip())
                      except ValueError:
                          name_length = 0
                      body = body[name_length:]
                  yield body
                  offset = start + size + (size & 1)


          def machine_of(kind, data):
              if kind == "elf":
                  if len(data) < 20 or data[:4] != b"\x7fELF":
                      return None
                  return struct.unpack_from("<H", data, 18)[0]
              if kind == "macho":
                  if len(data) < 8 or data[:4] not in (b"\xcf\xfa\xed\xfe", b"\xce\xfa\xed\xfe"):
                      return None
                  return struct.unpack_from("<I", data, 4)[0]
              if kind == "pe":
                  if len(data) < 64 or data[:2] != b"MZ":
                      return None
                  pe = struct.unpack_from("<I", data, 0x3C)[0]
                  if data[pe:pe + 4] != b"PE\0\0":
                      return None
                  return struct.unpack_from("<H", data, pe + 4)[0]
              return None


          def identify(kind, data):
              found = machine_of(kind, data)
              if found is not None:
                  return found
              if kind == "pe":
                  return None
              for member in ar_members(data) or []:
                  found = machine_of(kind, member)
                  if found is not None:
                      return found
              return None


          for artifact, directory, kind, machine, files in promises:
              root = os.path.join("artifacts", artifact)
              if not os.path.isdir(root):
                  failures.append(f"{artifact}: the job produced no artifact in this run")
                  continue
              for name in files:
                  path = os.path.join(root, directory, name)
                  if not os.path.isfile(path):
                      failures.append(f"{artifact}: {path} is missing")
                      continue
                  with open(path, "rb") as handle:
                      data = handle.read()
                  if len(data) < 1024 * 1024:
                      failures.append(f"{artifact}: {path} is only {len(data)} bytes")
                      continue
                  found = identify(kind, data)
                  if found != machine:
                      reported = "0x%x" % found if found is not None else "unknown"
                      failures.append(f"{artifact}: {path} is machine {reported}, expected {kind} 0x{machine:x}")
                      continue
                  print(f"{artifact}: {path} {len(data)} bytes sha256 {hashlib.sha256(data).hexdigest()}")
              version_file = None
              for name in ("libcronet_cgo.go", "libcronet.go"):
                  candidate = os.path.join(root, directory, name)
                  if os.path.isfile(candidate):
                      version_file = candidate
                      break
              if version_file is None:
                  failures.append(f"{artifact}: {directory} has no generated version file")
                  continue
              with open(version_file, encoding="utf-8") as handle:
                  for line in handle:
                      if line.startswith("const Version = "):
                          versions[artifact] = line.split('"')[1]
                          break
                  else:
                      failures.append(f"{artifact}: {version_file} has no Version constant")

          if len(set(versions.values())) > 1:
              failures.append(f"the artifacts are not from one Chromium baseline: {versions}")
          elif versions:
              print(f"Chromium baseline: {next(iter(versions.values()))}")

          if failures:
              print("FAIL:", file=sys.stderr)
              for failure in failures:
                  print(f"  - {failure}", file=sys.stderr)
              raise SystemExit(1)
          print("every promised target is present, native, and of the expected architecture")
          PY

      - name: Merge artifacts
        run: |
          for dir in artifacts/cronet-*/; do
            cp -r "$dir"/* .
          done
          ls -laR lib/ include/ include_cgo.go

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish
        run: go run ./cmd/build-naive publish --branch ${{ env.TARGET_BRANCH }}

      - name: Record the published revision
        id: published
        run: |
          set -euo pipefail
          commit=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)
          if [ -z "$commit" ]; then
            echo "FAIL: ${TARGET_BRANCH} does not exist after publish" >&2
            exit 1
          fi
          echo "branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "published ${TARGET_BRANCH} at ${commit}"

  consume:
    # Building a library is not the same as shipping it. This job consumes the branch the publish step
    # just wrote, starting from an empty module cache: it resolves the modules by commit the way a
    # consumer does, then links and runs the Linux amd64 artifact through the module system. The other
    # four daily targets are exercised by their own build jobs (darwin/arm64 and windows/amd64 run the
    # engine, android/arm64 and ios/arm64 are linked), and linux/amd64 is the one this profile newly
    # added - so it is the one that gets an end-to-end consumer check.
    needs: [plan, publish]
    if: |
      always() && !cancelled()
      && needs.publish.result == 'success'
      && needs.plan.outputs.profile == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Identify the module path and the repository that serves it
        id: identity
        run: |
          set -euo pipefail
          module=$(sed -n 's/^module //p' go.mod)
          origin="github.com/${{ github.repository }}"
          if [ -z "$module" ]; then
            echo "FAIL: cannot read the module path from go.mod" >&2
            exit 1
          fi
          echo "module=${module}" >> "$GITHUB_OUTPUT"
          echo "origin=${origin}" >> "$GITHUB_OUTPUT"
          echo "consuming ${module} from ${origin}"

      - name: Resolve the published modules with an empty cache
        env:
          PUBLISHED_COMMIT: ${{ needs.publish.outputs.commit }}
          MODULE: ${{ steps.identity.outputs.module }}
          ORIGIN: ${{ steps.identity.outputs.origin }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLISHED_COMMIT" ]; then
            echo "FAIL: the publish job reported no commit" >&2
            exit 1
          fi
          export GOMODCACHE="$RUNNER_TEMP/consume-cache"
          export GOPROXY=direct GOSUMDB=off GOFLAGS=-mod=mod GIT_TERMINAL_PROMPT=0
          # The published go.mod keeps the upstream module paths, and consumers point them at the
          # repository that actually has the commits. Doing the same here is what makes this check
          # meaningful: nothing is read from the publisher's module cache.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://${ORIGIN}.insteadOf"
          export GIT_CONFIG_VALUE_0="https://${MODULE}"

          work="$RUNNER_TEMP/consume"
          mkdir -p "$work"
          cd "$work"
          go mod init consume
          go get "${MODULE}@${PUBLISHED_COMMIT}" "${MODULE}/all@${PUBLISHED_COMMIT}" "${MODULE}/lib/linux_amd64@${PUBLISHED_COMMIT}"
          go list -m all | tee "$GITHUB_WORKSPACE/consumed-modules.txt"

          cat > main.go <<EOF
          package main

          import (
          	"fmt"
          	"os"

          	cronet "${MODULE}"
          	_ "${MODULE}/lib/linux_amd64"
          )

          func main() {
          	params := cronet.NewEngineParams()
          	params.SetUserAgent("cronet-go-consume-check")
          	defer params.Destroy()

          	engine := cronet.NewEngine()
          	if result := engine.StartWithParams(params); result != cronet.ResultSuccess {
          		fmt.Fprintf(os.Stderr, "engine start failed: %v\n", result)
          		os.Exit(1)
          	}
          	defer engine.Destroy()
          	defer engine.Shutdown()

          	fmt.Println("engine version:", engine.Version())
          }
          EOF

      - name: Run the published Linux amd64 library through purego
        env:
          MODULE: ${{ steps.identity.outputs.module }}
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/consume-cache"
          export GOFLAGS=-mod=mod GIT_TERMINAL_PROMPT=0
          cd "$RUNNER_TEMP/consume"
          library_directory=$(go list -m -f '{{.Dir}}' "${MODULE}/lib/linux_amd64")
          cp "${library_directory}/libcronet.so" .
          CGO_ENABLED=0 go build -tags with_purego -o consume-purego .
          LD_LIBRARY_PATH="$PWD" ./consume-purego | tee "$GITHUB_WORKSPACE/purego-version.txt"
          grep -q "engine version: " "$GITHUB_WORKSPACE/purego-version.txt"

      - name: Link the published static library into a cgo program
        env:
          MODULE: ${{ steps.identity.outputs.module }}
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/consume-cache"
          export GOFLAGS=-mod=mod GIT_TERMINAL_PROMPT=0
          cd "$RUNNER_TEMP/consume"
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          CGO_ENABLED=1 CC=clang CGO_LDFLAGS="-fuse-ld=lld" go build -o consume-cgo .
          ./consume-cgo | tee "$GITHUB_WORKSPACE/cgo-version.txt"
          grep -q "engine version: " "$GITHUB_WORKSPACE/cgo-version.txt"

      - name: Upload the consumption log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consume-linux-amd64
          path: |
            consumed-modules.txt
            purego-version.txt
            cgo-version.txt
          if-no-files-found: warn

  release:
    # Consumes the Linux artifacts, which only the full profile builds.
    needs: [plan, linux, windows]
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.profile == 'full'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cronet-linux-*
          path: artifacts/
          merge-multiple: false

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cronet-windows-*
          path: artifacts/
          merge-multiple: false

      - name: Get Chromium version
        id: chromium
        run: |
          VERSION=$(grep -h 'const Version' artifacts/cronet-linux-amd64/lib/linux_amd64/libcronet_cgo.go | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare release assets
        run: |
          mkdir -p release

          # Linux glibc shared libraries
          for dir in artifacts/cronet-linux-*/lib/linux_*; do
            if [[ "$dir" != *_musl ]]; then
              ARCH=$(basename "$dir" | sed 's/linux_//')
              if [ -f "$dir/libcronet.so" ]; then
                cp "$dir/libcronet.so" "release/libcronet-linux-${ARCH}.so"
              fi
            fi
          done

          # Windows DLLs
          for dir in artifacts/cronet-windows-*/lib/windows_*; do
            ARCH=$(basename "$dir" | sed 's/windows_//')
            if [ -f "$dir/libcronet.dll" ]; then
              cp "$dir/libcronet.dll" "release/libcronet-windows-${ARCH}.dll"
            fi
          done

          ls -la release/

      - name: Create or update release draft
        if: github.event.inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          CHROMIUM_VERSION="${{ steps.chromium.outputs.version }}"

          # Check if release exists
          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION exists, uploading assets..."
          else
            echo "Creating release draft $VERSION..."
            gh release create "$VERSION" \
              --draft \
              --title "$VERSION" \
              --notes "Cronet Go binding release based on Chromium $CHROMIUM_VERSION"
          fi

          # Upload assets (Linux .so and Windows .dll)
          gh release upload "$VERSION" release/* --clobber
