name: Apple cgo link check

# Go 1.27.4 rejects "-l:<filename>" in #cgo LDFLAGS (CVE-2026-97038); the lib
# modules now pass ${SRCDIR}/libcronet.a directly.  This dispatch-only check
# links the published ios/arm64 and darwin/arm64 archives with Go 1.27.4 and
# the real Xcode toolchain, which the Windows host cannot do.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CRONET_LIB_VERSION: v0.0.0-20261116145241-b9f445ddb1f4

jobs:
  link:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Link the iOS and macOS archives
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "${work}"
          cat > go.mod <<EOF
          module cronet-apple-check

          go 1.24

          require (
            github.com/sagernet/cronet-go/lib/darwin_arm64 v0.0.0
            github.com/sagernet/cronet-go/lib/ios_arm64 v0.0.0
          )

          replace github.com/sagernet/cronet-go/lib/darwin_arm64 => github.com/Piggy-Cat-bit-shadow/cronet-go/lib/darwin_arm64 ${CRONET_LIB_VERSION}

          replace github.com/sagernet/cronet-go/lib/ios_arm64 => github.com/Piggy-Cat-bit-shadow/cronet-go/lib/ios_arm64 ${CRONET_LIB_VERSION}
          EOF
          mkdir -p ioscheck maccheck
          cat > ioscheck/main.go <<'EOF'
          package main

          import _ "github.com/sagernet/cronet-go/lib/ios_arm64"

          func main() {}
          EOF
          cat > maccheck/main.go <<'EOF'
          package main

          import _ "github.com/sagernet/cronet-go/lib/darwin_arm64"

          func main() {}
          EOF
          echo "== iOS arm64 =="
          ( cd ioscheck && GOOS=ios GOARCH=arm64 CGO_ENABLED=1 go build -mod=mod -buildmode=c-archive -o "${work}/ioscheck.a" . )
          echo "== macOS arm64 =="
          ( cd maccheck && GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -mod=mod -buildmode=c-archive -o "${work}/maccheck.a" . )
          ls -l "${work}/ioscheck.a" "${work}/maccheck.a"
          echo "PASS: $(go version) linked both Apple archives"
