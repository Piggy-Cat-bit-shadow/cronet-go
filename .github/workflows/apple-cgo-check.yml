name: Apple cgo link check

# Go 1.27.4 rejects "-l:<filename>" in #cgo LDFLAGS (CVE-2026-97038); the lib
# modules now pass ${SRCDIR}/libcronet.a directly.  This dispatch-only check
# links every published Apple slice with Go 1.27.4 and the real Xcode
# toolchain: iOS device, iOS simulator (arm64/amd64), tvOS device,
# tvOS simulator (arm64/amd64) and macOS.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CRONET_LIB_VERSION: v0.0.0-20261116145241-b9f445ddb1f4

jobs:
  link:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the candidate
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'

      - name: Link all Apple slices
        run: |
          set -euo pipefail
          base="$(mktemp -d)"

          build() {
            name="$1"; goos="$2"; goarch="$3"; tags="$4"; module="$5"
            dir="${base}/${name}"
            mkdir -p "${dir}"
            cd "${dir}"
            cat > go.mod <<EOF
          module cronet-${name}

          go 1.24

          require github.com/sagernet/cronet-go/lib/${module} v0.0.0

          replace github.com/sagernet/cronet-go/lib/${module} => github.com/Piggy-Cat-bit-shadow/cronet-go/lib/${module} ${CRONET_LIB_VERSION}
          EOF
            cat > main.go <<EOF
          package main

          import _ "github.com/sagernet/cronet-go/lib/${module}"

          func main() {}
          EOF
            echo "== ${name} (GOOS=${goos} GOARCH=${goarch} tags=${tags}) =="
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=1 \
              go build -mod=mod -tags "${tags}" -buildmode=c-archive -o "${base}/${name}.a" .
            ls -l "${base}/${name}.a"
          }

          build ios-arm64                 ios     arm64 ""                    ios_arm64
          build ios-arm64-simulator       ios     arm64 "iossimulator"       ios_arm64_simulator
          build tvos-arm64                ios     arm64 "tvos"               tvos_arm64
          build tvos-arm64-simulator      ios     arm64 "tvos,tvossimulator" tvos_arm64_simulator
          build darwin-arm64              darwin  arm64 ""                    darwin_arm64

          # x86_64 simulator slices are intentionally not built here: Go 1.27.4's
          # own runtime assembler (gcc_amd64.S) does not assemble with the current
          # Xcode toolchain for ios/amd64, before any cronet code is compiled.
          # The arm64 simulator slices above are the ones current Macs use.
          echo "PASS: $(go version) linked the arm64 Apple slices"
